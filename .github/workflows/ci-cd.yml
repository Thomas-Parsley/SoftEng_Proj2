name: CI and CD - Object Recognition

# When should this run?
on:
  push:
    branches: ["main"]

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1) Get your code onto the GitHub runner
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3) Install Python packages your code likely needs
      #    If you see "ModuleNotFoundError" later, add that package here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest torch opencv-python numpy ultralytics

      # 4) Run our very simple test (CI)
      - name: Run tests
        run: pytest -q tests/test_dummy.py

      # 5) Run your object recognition script (CD)
      - name: Run object recognition script
        run: python video_tests/RunModel.py

      # 6) Upload any outputs in the "runs" folder (if it exists)
      - name: Upload model outputs
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: model_outputs
          path: runs/
          if-no-files-found: ignore
