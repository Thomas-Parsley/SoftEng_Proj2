name: CI and CD - Object Recognition

on:
  push:
    branches: ["main"]

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1) Get your code onto the GitHub runner
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3) Install only lightweight dependencies (no big ML libs to avoid disk issues)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pytest

      # 4) Run our very simple test (CI)
      - name: Run tests
        run: pytest -q tests/test_dummy.py

      # 5) Run deployment demo script (CD)
      - name: Run deployment demo script
        run: python ci_run_demo.py

      # 6) Optional: clean up anything big if you ever create it
      - name: Clean workspace to prevent storage errors
        run: rm -rf runs
